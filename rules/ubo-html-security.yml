rules:
  - id: html-missing-csp-meta
    languages: [generic]
    message: "Falta CSP en <head>. Agrega meta http-equiv='Content-Security-Policy' o cabecera CSP."
    severity: WARNING
    patterns:
      - pattern: "<head>"
      - pattern-not: "<meta http-equiv=\"Content-Security-Policy\""
    paths:
      include: ["**/*.html"]

  - id: html-inline-event-handlers
    languages: [generic]
    message: "Manejador inline (onclick, onload, ...) detectado. Usa addEventListener y sanitiza para evitar DOM XSS."
    severity: WARNING
    pattern-regex: "\\son[a-z]+\\s*="
    paths:
      include: ["**/*.html"]

  - id: html-target-blank-without-rel
    languages: [generic]
    message: "Enlace con target=\"_blank\" sin rel=\"noopener noreferrer\" (tabnabbing)."
    severity: WARNING
    pattern-regex: "<a[^>]*\\starget=\\\"_blank\\\"(?![^>]*rel=)"
    paths:
      include: ["**/*.html"]
