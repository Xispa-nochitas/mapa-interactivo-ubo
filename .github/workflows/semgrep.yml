name: Semgrep CI
on:
  push:
    branches: [ main ]
  pull_request: {}

# Puedes ponerlo aquí (nivel workflow) o dentro del job:
permissions:
  contents: read
  security-events: write     # ⬅ necesario para subir SARIF
  pull-requests: write       # ⬅ si quieres anotaciones en PR (opcional)

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (HTML, OWASP Top 10, Secrets)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep ci --config semgrep.yml --sarif --output results.sarif || true

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
