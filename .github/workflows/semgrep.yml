name: Semgrep CI
on:
  push: { branches: [ main ] }
  pull_request: {}
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Usa la imagen oficial de Semgrep y ejecuta 'semgrep ci'
      - name: Run Semgrep (OWASP Top 10 + extras)
        uses: docker://returntocorp/semgrep:latest
        env:
          # Opcional: si usarás el dashboard de Semgrep App, define este secret
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        with:
          # El campo 'args' no existe para Docker actions; pasamos el comando completo en run
          # -> así que hacemos otro paso 'run' para claridad:
          entrypoint: ""
      - name: Semgrep scan
        run: |
          semgrep ci --config p/owasp-top-ten --config p/secrets --config p/ci
