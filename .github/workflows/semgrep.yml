name: Semgrep CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 👉 Arregla el "dubious ownership" dentro del contenedor
      - name: Fix git safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: (Debug) List tracked files
        run: |
          echo "=== GIT LS-FILES (debug) ==="
          git ls-files | sed -n '1,200p'

      # 1) Intento con tu config remota (OWASP/secrets/ci desde semgrep.yml)
      - name: Run Semgrep (REMOTE CONFIG)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}  # opcional
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          echo "=== RUNNING SEMGREP (REMOTE CONFIG) ==="
          semgrep ci \
            --config semgrep.yml \
            --include index.html \
            --sarif --output results.sarif \
            --no-suppress-errors \
            --metrics=off \
            --timeout 240 \
            --debug || true

      - name: Upload SARIF to GitHub (remote)
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      # 2) Respaldo: reglas locales sobre index.html (garantiza hallazgos para tu informe)
      - name: Run Semgrep (LOCAL RULES)
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          echo "=== RUNNING SEMGREP (LOCAL RULES) ==="
          semgrep scan \
            --config rules/ubo-html-security.yml \
            --include index.html \
            --sarif --output results_local.sarif \
            --metrics=off --strict

      - name: Upload SARIF to GitHub (local)
        if: always() && hashFiles('results_local.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results_local.sarif

