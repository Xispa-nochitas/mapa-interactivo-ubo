 - name: Run Semgrep (HTML local rules first)
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          echo "=== GIT LS-FILES (debug) ==="
          git ls-files | sed -n '1,200p'

          echo "=== RUNNING SEMGREP (LOCAL RULES) ==="
          # 1) Ejecuta SOLO reglas locales (no depende de internet)
          semgrep scan \
            --config rules/ubo-html-security.yml \
            --include 'index.html' \
            --sarif --output results_local.sarif \
            --metrics=off --strict --debug

      - name: Upload SARIF (local rules)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results_local.sarif
